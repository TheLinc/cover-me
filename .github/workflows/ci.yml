# The backend suite (pgTAP plus function tests against the mock server) runs on a
# local Supabase stack in Docker. The Supabase CLI maps
# host.docker.internal to the runner, so the functions reach the mock on Linux.
# The backend suite skips when nothing it reads changed (see the backend job).
name: CI

on:
  push:
    branches: [master]
  pull_request:

# A newer push to the same PR cancels the run it replaces. Each master push gets
# its own group and always finishes: the backend job only diffs that push, so a
# cancelled run could hide a backend change from the suite.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm rebuild esbuild
      - run: pnpm typecheck
      - run: pnpm exec eslint .
      - run: pnpm test
      - run: pnpm build
      # Comments in every file the PR changes (#271). A PR checks out its merge
      # commit, whose first parent is the base branch.
      - if: github.event_name == 'pull_request'
        run: node --test ../scripts/check-comments.test.mjs && node ../scripts/check-comments.mjs HEAD^1

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm exec eslint .
      - run: pnpm test
      - run: pnpm check

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # paths-filter reads a PR's changed files from the API.
    permissions:
      contents: read
      pull-requests: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # backend is a required check, so the job always runs and reports. When
      # nothing the suite reads changed, the steps after this one skip. The
      # suite also reads the extension's scrapers and fixtures, and pnpm test
      # runs scripts/sync-scrapers.mjs --check.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'extension/src/content/scrapers/**'
              - 'scripts/sync-scrapers.mjs'
              - '.github/workflows/ci.yml'
      - if: steps.changes.outputs.backend == 'true'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.8
      - if: steps.changes.outputs.backend == 'true'
        working-directory: backend/supabase/functions
        run: deno lint
      # The Supabase ports sit inside Linux's ephemeral range, so an outgoing
      # connection (an image pull) can hold 54324 when mailpit tries to bind it.
      - if: steps.changes.outputs.backend == 'true'
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54329
      - if: steps.changes.outputs.backend == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10
      - if: steps.changes.outputs.backend == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - if: steps.changes.outputs.backend == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.changes.outputs.backend == 'true'
        run: pnpm typecheck
      - if: steps.changes.outputs.backend == 'true'
        run: pnpm test
