# Pull requests and pushes to master: extension build (includes prompt sync and
# check-dist), web unit tests and brand check, and the backend suite (pgTAP plus function tests against the
# mock server) on a local Supabase stack in Docker. The Supabase CLI maps
# host.docker.internal to the runner, so the functions reach the mock on Linux.
name: CI

on:
  push:
    branches: [master]
  pull_request:

# A newer push to the same branch or PR cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm rebuild esbuild
      - run: pnpm test
      - run: pnpm build

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm check

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      # backend is a required check, so the job always runs and reports. When
      # nothing the suite reads changed, the steps after this one skip. The
      # suite also reads the extension's scrapers and fixtures, and pnpm test
      # runs scripts/sync-scrapers.mjs --check.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'extension/src/content/scrapers/**'
              - 'scripts/sync-scrapers.mjs'
              - '.github/workflows/ci.yml'
      # The Supabase ports sit inside Linux's ephemeral range, so an outgoing
      # connection (an image pull) can hold 54324 when mailpit tries to bind it.
      - if: steps.changes.outputs.backend == 'true'
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54329
      - if: steps.changes.outputs.backend == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10
      - if: steps.changes.outputs.backend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - if: steps.changes.outputs.backend == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.changes.outputs.backend == 'true'
        run: pnpm test
