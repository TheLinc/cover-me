# Weekly: every supported board's scraper against a live posting. Boards change
# their markup without notice; this fails before users hit it. When it fails,
# re-save that board's fixture (pnpm fixtures:save <board>), fix the scraper
# until the fixture test passes, and commit both.
name: Scraper smoke

on:
  schedule:
    - cron: '0 13 * * 1' # Mondays 13:00 UTC
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm rebuild esbuild
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:scrapers-live
