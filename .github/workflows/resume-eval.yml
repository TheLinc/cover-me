# Live resume quality eval: parses, tailors, checks and judges a tailored
# resume for every industry case in extension/eval. Runs when the AI prompt
# code or the eval changes, weekly (to catch model drift), or on demand.
#
# Billing: uses the CLAUDE_CODE_OAUTH_TOKEN secret (from `claude setup-token`)
# so calls go through Claude Code on your Claude plan. If you instead add an
# ANTHROPIC_API_KEY secret and remove the OAuth one, it uses API credits.
name: Resume quality eval

on:
  push:
    branches: [master]
    paths:
      - extension/src/lib/ai/**
      - extension/eval/**
      - backend/supabase/functions/tailor/**
      - backend/supabase/functions/_shared/resume-parse.ts
      - .github/workflows/resume-eval.yml
  pull_request:
    paths:
      - extension/src/lib/ai/**
      - extension/eval/**
      - backend/supabase/functions/tailor/**
      - backend/supabase/functions/_shared/resume-parse.ts
      - .github/workflows/resume-eval.yml
  schedule:
    - cron: '0 9 * * 1' # Mondays 09:00 UTC
  workflow_dispatch:
    inputs:
      runs:
        description: Samples per case
        default: '1'
      industry:
        description: Only this industry (blank = all)
        default: ''

concurrency:
  group: resume-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: extension
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: npm install -g @anthropic-ai/claude-code
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
      - name: Resume eval (parse, tailor, integrity checks, industry judge)
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::No CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY secret; skipping the live eval (fork PRs never get secrets)."
            exit 0
          fi
          ARGS="--live --tailor --judge --baseline --concurrency 4 --runs ${RUNS:-1}"
          if [ -n "$INDUSTRY" ]; then ARGS="$ARGS --industry $INDUSTRY"; fi
          pnpm eval $ARGS
        env:
          RUNS: ${{ github.event_name == 'schedule' && '2' || inputs.runs }}
          INDUSTRY: ${{ inputs.industry }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resume-eval-reports
          path: extension/eval/reports/
          if-no-files-found: ignore
