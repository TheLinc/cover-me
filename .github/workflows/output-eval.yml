# Live output eval: generates cover letters and tailored resumes for real test
# cases and has a model judge them.
#
#   Prompt PRs: the quick set (11 cases: one per field family plus two long
#   postings), judged by Sonnet 5.5, gated on extension/eval/baseline.json.
#   About 10 min. Not re-run on the merge to master: the PR already tested
#   that content, and every run spends the Claude plan.
#   On demand (Actions > Output eval > Run workflow): every case, 2 runs per
#   resume, judged by Opus 5.5, gated on extension/eval/baseline-full.json once
#   that file exists. Run it at milestones, not per change.
#   Weekly: paused during active development (2026-10-09). Turn the schedule
#   below back on at launch, when catching model drift matters.
#   Manual runs with "update_baseline" save the scores as an eval-baseline
#   artifact to commit (the first full run needs this to create baseline-full).
#
# Billing: only the CLAUDE_CODE_OAUTH_TOKEN secret (from `claude setup-token`),
# so every call goes through `claude -p` on the Claude plan. There is no API key
# fallback: ANTHROPIC_API_KEY is blanked and the eval runs with --via claude.
# Without the secret (fork PRs never get secrets) the job skips with a warning.
#
# Not a required check: GitHub never reports a path-filtered workflow on
# unrelated PRs, so a required one would leave those PRs waiting forever.
name: Output eval

on:
  pull_request:
    paths:
      - extension/src/lib/ai/**
      - extension/eval/**
      - backend/supabase/functions/generate/**
      - backend/supabase/functions/tailor/**
      - backend/supabase/functions/_shared/anthropic.ts
      - backend/supabase/functions/_shared/letter-lint.ts
      - backend/supabase/functions/_shared/resume-parse.ts
      - backend/supabase/functions/_shared/resume-grounding.ts
      - scripts/check-prompt-sync.mjs
      # Not this file: a workflow-only edit can be checked with a manual run.
  # Paused during active development; restore at launch.
  # schedule:
  #   - cron: '0 9 * * 1' # Mondays 09:00 UTC: the full set, to catch model drift
  workflow_dispatch:
    inputs:
      full:
        description: Run every case (otherwise the quick set)
        type: boolean
        default: true
      update_baseline:
        description: Save this run's scores as the new baseline (download the eval-baseline artifact and commit it)
        type: boolean
        default: false

concurrency:
  group: output-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: extension
    # The token is only in the eval step's env, so no other step (third-party
    # actions, package install scripts) can read it. Other steps see HAS_TOKEN.
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      ANTHROPIC_API_KEY: ''
      FULL: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: npm install -g @anthropic-ai/claude-code
        if: env.HAS_TOKEN == 'true'
      - name: Output eval (letters and tailored resumes)
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::warning::No CLAUDE_CODE_OAUTH_TOKEN secret; skipping the live eval (fork PRs never get secrets)."
            exit 0
          fi
          EXTRA=""
          if [ "$UPDATE_BASELINE" = "true" ]; then EXTRA="--update-baseline"; fi
          if [ "$FULL" = "true" ]; then
            pnpm eval --live --judge --baseline --via claude --runs 2 --judge-model claude-opus-5-5 $EXTRA
          else
            pnpm eval --live --quick --judge --baseline --via claude $EXTRA
          fi
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          UPDATE_BASELINE: ${{ github.event_name == 'workflow_dispatch' && inputs.update_baseline }}
      # The workflow can't push to master, so a refreshed baseline comes out as
      # an artifact: download it and commit it to extension/eval/.
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch' && inputs.update_baseline
        with:
          name: eval-baseline
          path: |
            extension/eval/baseline.json
            extension/eval/baseline-full.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: output-eval-reports
          path: extension/eval/reports/
          if-no-files-found: ignore
