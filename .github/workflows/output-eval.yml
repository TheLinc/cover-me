# Generates letters, tailored resumes and answers for test cases and has a
# model judge them. PRs run the quick set against extension/eval/baseline.json,
# only for the sides the diff touches (scripts/eval-side.sh). A manual run does
# every case by default, judged by Opus, against baseline-full.json. Usage: README.md.
#
# Not re-run on merge: the PR tested it, and every run spends the Claude plan.
# Billing is CLAUDE_CODE_OAUTH_TOKEN only; without it (fork PRs) the job skips.
# Not a required check: GitHub never reports a path-filtered workflow on
# unrelated PRs, so a required one would leave them waiting forever.
name: Output eval

on:
  pull_request:
    paths:
      - extension/src/lib/ai/**
      - extension/eval/**
      - backend/supabase/functions/generate/**
      - backend/supabase/functions/tailor/**
      - backend/supabase/functions/answer/**
      - backend/supabase/functions/_shared/answer.ts
      - backend/supabase/functions/_shared/anthropic.ts
      - backend/supabase/functions/_shared/letter-lint.ts
      - backend/supabase/functions/_shared/resume-parse.ts
      - backend/supabase/functions/_shared/resume-grounding.ts
      - scripts/check-prompt-sync.mjs
      # Not this file: check a workflow-only edit with a manual run.
  # Paused during development; turn back on at launch to catch model drift.
  # schedule:
  #   - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      full:
        description: Run every case (otherwise the quick set)
        type: boolean
        default: true
      update_baseline:
        description: Save this run's scores as the new baseline (download the eval-baseline artifact and commit it)
        type: boolean
        default: false
      side:
        description: Which outputs to evaluate (auto = from the diff against master)
        type: choice
        options: [auto, letters, tailor, answers, all]
        default: auto

concurrency:
  group: output-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: extension
    # The token lives only in the eval step's env, out of reach of other steps.
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      FULL: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # eval-side.sh diffs against the base branch
      - name: Pick the eval sides (letters, tailor, answers, or all)
        id: side
        working-directory: .
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$INPUT_SIDE" != "auto" ]; then
            SIDE="$INPUT_SIDE"
          elif [ "$EVENT" = "pull_request" ]; then
            SIDE=$(bash scripts/eval-side.sh "$PR_BASE")
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            SIDE=$(bash scripts/eval-side.sh origin/master)
          else
            SIDE=all
          fi
          echo "Eval side: $SIDE"
          echo "side=$SIDE" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          INPUT_SIDE: ${{ inputs.side }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: npm install -g @anthropic-ai/claude-code
        if: env.HAS_TOKEN == 'true'
      - name: Output eval (${{ steps.side.outputs.side }})
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::warning::No CLAUDE_CODE_OAUTH_TOKEN secret; skipping the live eval (fork PRs never get secrets)."
            exit 0
          fi
          EXTRA=""
          if [ "$UPDATE_BASELINE" = "true" ]; then EXTRA="--update-baseline"; fi
          for s in $SIDE; do if [ "$s" != "all" ]; then EXTRA="$EXTRA --$s"; fi; done
          if [ "$FULL" = "true" ]; then
            pnpm eval --live --judge --baseline --runs 2 --judge-model claude-opus-5-5 $EXTRA
          else
            pnpm eval --live --quick --judge --baseline $EXTRA
          fi
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          UPDATE_BASELINE: ${{ github.event_name == 'workflow_dispatch' && inputs.update_baseline }}
          SIDE: ${{ steps.side.outputs.side }}
      # The workflow can't push to master: commit this artifact to extension/eval/.
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch' && inputs.update_baseline
        with:
          name: eval-baseline
          path: |
            extension/eval/baseline.json
            extension/eval/baseline-full.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: output-eval-reports
          path: extension/eval/reports/
          if-no-files-found: ignore
